[package]
name = "guigu-t050-n"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[dependencies]
guigu-agent-bridge = { path = "../.." }
libc = "=0.2.189"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tokio = { version = "=1.53.1", features = ["rt", "signal", "time", "net"] }

[dev-dependencies]
tempfile = "=3.27.0"

[[bin]]
name = "guigu-t050-n-parent"
path = "src/bin/guigu-t050-n-parent.rs"

[[bin]]
name = "guigu-t050-n-helper"
path = "src/bin/guigu-t050-n-helper.rs"

[[bin]]
name = "guigu-t050-n-provisioner"
path = "src/bin/guigu-t050-n-provisioner.rs"
