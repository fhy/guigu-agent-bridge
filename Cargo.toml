[package]
name = "guigu-agent-bridge"
version = "0.2.2"
edition = "2024"
rust-version = "1.94"
description = "Durable Matrix, ACP, and A2A task routing bridge for external agents"
license = "MIT"
repository = "https://github.com/guigu-ai/guigu-agent-bridge"
homepage = "https://github.com/guigu-ai/guigu-agent-bridge"
documentation = "https://docs.rs/guigu-agent-bridge"
readme = "README.md"
keywords = ["agent", "matrix", "acp", "a2a", "sqlite"]
categories = ["asynchronous", "command-line-utilities"]
include = [
    "!/.agent-governance/**",
    "!/AGENTS.md",
    "!/tests/**",
    "!/target/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/LICENSE",
    "/README.md",
    "/config.example.toml",
    "/docs/ARCHITECTURE.md",
    "/docs/CONFIGURATION.md",
    "/docs/PRODUCT.md",
    "/docs/RELEASE.md",
    "/docs/RELEASE-0.2.0.md",
    "/docs/RELEASE-0.2.1.md",
    "/docs/USER_GUIDE.md",
    "/docs/decisions/**",
    "/docs/integrations/**",
    "/examples/**",
    "/migrations/**",
    "/src/**",
]

[dependencies]
# `time` backs the production `Timer` (`TokioTimer`, T006 D1/Q2 = T-B): the
# worker's timeout/backoff race needs `tokio::time::sleep`. `process` backs the
# ACP adapter (T014 D2/Q3 = A): the child process needs `tokio::process`, and
# `io-util` is declared explicitly because the framing layer reads and writes
# pipes directly (it was only reachable through sqlx's features before). Features
# are not crates, so `Cargo.lock` is unchanged.
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "signal",
    "sync",
    "time",
    "process",
    "io-util",
    "net",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v7", "serde", "v5"] }
chrono = { version = "0.4", features = ["serde"] }
toml = "1.1.6"
url = "2.5.8"
matrix-sdk = { version = "=0.13.0", default-features = false, features = ["rustls-tls", "e2e-encryption", "sqlite", "bundled-sqlite"] }
axum = { version = "=0.8.6", default-features = false, features = ["http1", "json", "tokio"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "json"] }
# SQLite driver for the durable event store (ADR-002). `default-features = false`
# avoids the `any`/`json` backends; `macros` is required for `sqlx::migrate!`, and
# `sqlite` shares libsqlite3-sys 0.33 with matrix-sdk's official SQLite store.
sqlx = { version = "0.9.0", default-features = false, features = [
    "sqlite",
    "runtime-tokio",
    "migrate",
    "macros",
] }

[dev-dependencies]
wiremock = "0.6.5"
