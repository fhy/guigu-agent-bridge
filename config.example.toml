# guigu-agent-bridge configuration example
# Keep credentials in environment variables or a secret manager.

[bridge]
database = "~/.local/share/guigu-agent-bridge/state.db"
session_root = "~/.cache/guigu-agent-bridge/sessions"
max_task_depth = 8
max_task_hops = 16
default_timeout_seconds = 300
queue_capacity = 1024
event_capacity = 1024
shutdown_timeout_seconds = 30
health_bind = "127.0.0.1:9090"

[runtime]
max_turns = 8
max_wall_seconds = 900
max_inactivity_seconds = 120
max_no_progress = 2
max_output_bytes = 1048576
lease_ttl_seconds = 30

[transports.matrix]
enabled = false
homeserver = "https://matrix.example"
user_id = "{env:MATRIX_USER_ID}"
access_token = "{env:MATRIX_ACCESS_TOKEN}"
monitor_room = ""
sync_capacity = 256
allowed_users = []
admin_users = []
admin_rooms = []

[transports.matrix.routes]
aliases = {}
rooms = {}
direct = {}

# A2A-over-Matrix gateway is independently disabled by default. It never
# reuses monitor_room or the ordinary Matrix user allowlist.
[transports.gateway]
enabled = false
room_id = "!gateway:example"
peer_id = "peer-a"
local_endpoint_id = "00000000-0000-0000-0000-000000000001"
remote_endpoint_id = "00000000-0000-0000-0000-000000000002"
allowed_senders = []
generation = 0
max_payload_bytes = 262144

# A2A is disabled by default. Outbound non-loopback peers must use HTTPS.
# [transports.a2a]
# enabled = false
# listen = "tcp:127.0.0.1:0"
#
# [transports.a2a.peers.example]
# url = "https://a2a.internal.example/a2a/worker/rpc"
# expected_peer_id = "trusted-peer"
# token = "{env:A2A_PEER_TOKEN}"
# allowed_targets = ["worker"]
# private_ca = "/etc/guigu-agent-bridge/private-ca.pem"
# DANGER: this defaults to false and is never enabled after a CA failure.
# When true, HTTPS encrypts traffic but does not authenticate the peer. An
# active MITM can read or modify bearer credentials and task data.
# danger_accept_invalid_certs = false

# Agent definitions are transport endpoints, not fixed business roles.
[agents.example]
transport = "acp"
command = "/usr/local/bin/opencode"
args = ["acp"]
enabled = false
workspace = ""
